<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2e1a">
<title>🌱 Sprossen Tracker v2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111a11;
    --surface: #1a2a1a;
    --surface2: #213021;
    --surface3: #2a3d2a;
    --green-dim: #4a7c4a;
    --green: #6ab46a;
    --green-bright: #8fce8f;
    --amber: #c8922a;
    --amber-bright: #e8b050;
    --red: #b44a4a;
    --red-bright: #d46060;
    --blue: #4a7ab4;
    --blue-bright: #6a9ad4;
    --text: #d4e8d4;
    --text-dim: #7a9a7a;
    --text-muted: #4a6a4a;
    --border: #2a3d2a;
    --border-bright: #3a5a3a;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    font-size: 13px;
    line-height: 1.5;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(17,26,17,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--green-bright);
    letter-spacing: 0.02em;
  }

  header h1 span {
    font-style: italic;
    opacity: 0.7;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .tab {
    flex: 1;
    padding: 11px 8px;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
    text-align: center;
  }

  .tab.active {
    background: rgba(106,180,106,0.15);
    border-color: var(--green-dim);
    color: var(--green-bright);
    font-weight: 500;
  }

  .tab:hover:not(.active) {
    background: var(--surface3);
    color: var(--text);
    border-color: var(--border-bright);
  }

  .tab-neu {
    flex: 1;
    padding: 11px 8px;
    background: rgba(106,180,106,0.1);
    border: 1px dashed var(--green-dim);
    border-radius: var(--radius-sm);
    color: var(--green);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
    text-align: center;
  }

  .tab-neu:hover {
    background: rgba(106,180,106,0.22);
    border-color: var(--green);
    color: var(--green-bright);
  }

  /* MAIN */
  main {
    padding: 16px;
    max-width: 540px;
    margin: 0 auto;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ADD BUTTON */
  .add-btn {
    width: 100%;
    padding: 14px;
    background: var(--surface2);
    border: 1px dashed var(--border-bright);
    border-radius: var(--radius);
    color: var(--green);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    margin-bottom: 14px;
    letter-spacing: 0.05em;
  }

  .add-btn:hover {
    background: var(--surface3);
    border-color: var(--green);
    color: var(--green-bright);
  }

  /* CHIP / CARD */
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .chip.phase-quellen { border-left: 3px solid var(--blue); }
  .chip.phase-dunkel { border-left: 3px solid var(--amber); }
  .chip.phase-hell { border-left: 3px solid var(--green); }

  .chip-header {
    padding: 12px 14px 10px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .glass-badge {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    background: var(--surface3);
    color: var(--green-bright);
    border: 1px solid var(--border-bright);
  }

  .chip-title-area {
    flex: 1;
    min-width: 0;
  }

  .chip-seeds {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 300;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chip-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    font-style: italic;
  }

  .chip-phase-badge {
    flex-shrink: 0;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .phase-badge-quellen { background: rgba(74,122,180,0.2); color: var(--blue-bright); border: 1px solid rgba(74,122,180,0.3); }
  .phase-badge-dunkel { background: rgba(200,146,42,0.2); color: var(--amber-bright); border: 1px solid rgba(200,146,42,0.3); }
  .phase-badge-hell { background: rgba(106,180,106,0.2); color: var(--green-bright); border: 1px solid rgba(106,180,106,0.3); }

  /* PHASE INFO ROW */
  .chip-timer {
    padding: 6px 14px 10px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .timer-value {
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-size: 13px;
  }

  /* WATERING BUTTONS */
  .watering-row {
    padding: 0 14px 12px;
    display: flex;
    gap: 8px;
  }

  .water-btn {
    flex: 1;
    padding: 9px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-bright);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .water-btn:hover:not(:disabled) {
    background: var(--surface3);
    border-color: var(--blue);
    color: var(--blue-bright);
  }

  .water-btn.done {
    background: rgba(74,122,180,0.12);
    border-color: rgba(74,122,180,0.3);
    color: rgba(106,154,212,0.5);
    cursor: not-allowed;
  }

  .water-btn.done::after {
    content: ' ✓';
  }

  .water-btn.missed {
    border-color: rgba(180,74,74,0.4);
    color: var(--red);
    background: rgba(180,74,74,0.08);
  }

  /* ACTION BUTTONS ROW */
  .chip-actions {
    padding: 0 14px 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .action-btn {
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-bright);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .action-btn.primary {
    background: rgba(106,180,106,0.15);
    border-color: var(--green-dim);
    color: var(--green-bright);
  }

  .action-btn.primary:hover {
    background: rgba(106,180,106,0.25);
    border-color: var(--green);
  }

  .action-btn.danger {
    background: rgba(180,74,74,0.1);
    border-color: rgba(180,74,74,0.3);
    color: var(--red);
  }

  .action-btn.danger:hover {
    background: rgba(180,74,74,0.2);
    border-color: var(--red);
    color: var(--red-bright);
  }

  .action-btn:hover:not(.primary):not(.danger) {
    background: var(--surface3);
    color: var(--text);
  }

  /* LOG SECTION */
  .chip-log-toggle {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 0.05em;
    transition: color 0.2s;
    user-select: none;
  }

  .chip-log-toggle:hover { color: var(--text-dim); }

  .log-arrow { transition: transform 0.2s; display: inline-block; }
  .log-arrow.open { transform: rotate(180deg); }

  .chip-log {
    display: none;
    padding: 10px 14px 12px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }

  .chip-log.open { display: block; }

  .log-entry {
    display: flex;
    gap: 10px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(42,61,42,0.5);
    font-size: 11px;
  }

  .log-entry:last-child { border-bottom: none; }

  .log-time { color: var(--text-muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .log-msg { color: var(--text-dim); }
  .log-msg.warn { color: var(--amber); }
  .log-msg.ok { color: var(--green); }
  .log-msg.danger { color: var(--red); }

  /* MODAL */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }

  .modal-backdrop.open {
    display: flex;
    animation: fadeIn 0.15s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 20px 32px;
    width: 100%;
    max-width: 540px;
    animation: slideUp 0.2s ease;
  }

  .modal h2 {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 300;
    color: var(--green-bright);
    margin-bottom: 16px;
    font-style: italic;
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-group label {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: var(--green);
  }

  .form-group select option {
    background: var(--surface2);
    color: var(--text);
  }

  .glass-selector {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .glass-option {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-bright);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 300;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .glass-option:hover:not(:disabled) {
    border-color: var(--green);
    color: var(--green-bright);
    background: rgba(106,180,106,0.1);
  }

  .glass-option.selected {
    border-color: var(--green);
    background: rgba(106,180,106,0.2);
    color: var(--green-bright);
  }

  .glass-option:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .seed-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
  }

  .seed-sep { color: var(--text-muted); text-align: center; font-size: 11px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-cancel {
    flex: 1;
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel:hover { border-color: var(--green-dim); color: var(--text); }

  .btn-confirm {
    flex: 2;
    padding: 12px;
    background: rgba(106,180,106,0.2);
    border: 1px solid var(--green-dim);
    border-radius: var(--radius-sm);
    color: var(--green-bright);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-confirm:hover { background: rgba(106,180,106,0.35); border-color: var(--green); }

  /* TOAST */
  .toast-container {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
    width: calc(100% - 32px);
    max-width: 508px;
  }

  .toast {
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text);
    animation: slideDown 0.25s ease;
    pointer-events: auto;
  }

  .toast.warn { border-color: var(--amber); background: rgba(200,146,42,0.15); color: var(--amber-bright); }
  .toast.ok { border-color: var(--green-dim); background: rgba(106,180,106,0.15); color: var(--green-bright); }
  .toast.error { border-color: var(--red); background: rgba(180,74,74,0.15); color: var(--red-bright); }

  @keyframes slideDown { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }

  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state p { font-family: 'Fraunces', serif; font-size: 16px; font-style: italic; }
  .empty-state small { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: block; }

  /* HISTORY CHIP */
  .history-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
    border-left: 3px solid var(--text-muted);
    opacity: 0.8;
  }

  .history-chip.aborted { border-left-color: var(--red); opacity: 0.6; }
  .history-chip.completed { border-left-color: var(--green-dim); }

  .history-chip-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .history-chip-title {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 300;
    flex: 1;
  }

  .history-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .badge-completed { background: rgba(106,180,106,0.15); color: var(--green); border: 1px solid rgba(106,180,106,0.3); }
  .badge-aborted { background: rgba(180,74,74,0.15); color: var(--red); border: 1px solid rgba(180,74,74,0.3); }

  .history-details {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .history-log-toggle {
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    margin-top: 6px;
    letter-spacing: 0.05em;
  }
  .history-log-toggle:hover { color: var(--text-dim); }

  .history-log { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .history-log.open { display: block; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  /* STEPPER INPUT */
  .stepper-row {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--surface2);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }

  .stepper-btn {
    width: 38px;
    height: 40px;
    background: var(--surface3);
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
    line-height: 1;
  }

  .stepper-btn:hover { background: var(--border-bright); color: var(--text); }
  .stepper-btn:active { background: var(--green-dim); color: var(--green-bright); }

  .stepper-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    text-align: center;
    outline: none;
    padding: 0 4px;
    height: 40px;
    min-width: 0;
  }

  .stepper-unit {
    padding-right: 10px;
    color: var(--text-muted);
    font-size: 11px;
    flex-shrink: 0;
  }

  /* HARVEST INPUT */
  .harvest-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }

  .harvest-input-row > span { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }

  /* HISTORY DELETE */
  .history-delete-btn {
    background: none;
    border: 1px solid rgba(180,74,74,0.25);
    border-radius: var(--radius-sm);
    color: var(--red);
    padding: 4px 10px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.6;
    letter-spacing: 0.03em;
  }

  .history-delete-btn:hover {
    opacity: 1;
    background: rgba(180,74,74,0.12);
    border-color: var(--red);
  }
</style>
</head>
<body>

<header>
  <h1>🌱 Sprossen <span>Tracker</span></h1>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('aktiv', this)">📋 Aktiv</button>
  <button class="tab" onclick="switchTab('history', this)">🗂 History</button>
  <button class="tab-neu" onclick="openNewChip()">+ Neu</button>
</div>

<main>
  <div id="tab-aktiv" class="tab-panel active">
    <div style="height:12px"></div>
    <div id="chips-container"></div>
    <div id="empty-aktiv" class="empty-state" style="display:none">
      <div class="icon">🫙</div>
      <p>Noch keine Sprossen</p>
      <small>Tippe auf "+ Neu" um ein Glas anzulegen</small>
    </div>
  </div>

  <div id="tab-history" class="tab-panel">
    <div style="height:12px"></div>
    <div id="history-container"></div>
    <div id="empty-history" class="empty-state" style="display:none">
      <div class="icon">📋</div>
      <p>Noch keine abgeschlossenen Ansätze</p>
    </div>
  </div>
</main>

<!-- NEW CHIP MODAL -->
<div class="modal-backdrop" id="modal-new">
  <div class="modal">
    <h2>Neues Glas anlegen</h2>

    <div class="form-group">
      <label>Glas Nr.</label>
      <div class="glass-selector" id="glass-selector">
        <button class="glass-option" data-num="1" onclick="selectGlass(1)">1</button>
        <button class="glass-option" data-num="2" onclick="selectGlass(2)">2</button>
        <button class="glass-option" data-num="3" onclick="selectGlass(3)">3</button>
        <button class="glass-option" data-num="4" onclick="selectGlass(4)">4</button>
      </div>
    </div>

    <div class="form-group">
      <label>Samen</label>
      <div class="seed-row">
        <input type="text" id="seed1-name" placeholder="z.B. Brokkoli" value="Brokkoli">
        <span class="seed-sep">+</span>
        <input type="text" id="seed2-name" placeholder="z.B. Radieschen" value="Radieschen">
      </div>
    </div>

    <div class="form-group">
      <label>Menge Samen 1</label>
      <div class="stepper-row">
        <button class="stepper-btn" onclick="stepSeed('seed1-amount', -0.5)">−</button>
        <input class="stepper-input" type="number" id="seed1-amount" value="5" min="0" step="0.5">
        <span class="stepper-unit">g</span>
        <button class="stepper-btn" onclick="stepSeed('seed1-amount', 0.5)">+</button>
      </div>
    </div>

    <div class="form-group">
      <label>Menge Samen 2</label>
      <div class="stepper-row">
        <button class="stepper-btn" onclick="stepSeed('seed2-amount', -0.5)">−</button>
        <input class="stepper-input" type="number" id="seed2-amount" value="5" min="0" step="0.5">
        <span class="stepper-unit">g</span>
        <button class="stepper-btn" onclick="stepSeed('seed2-amount', 0.5)">+</button>
      </div>
    </div>

    <div class="form-group">
      <label>Notiz (optional)</label>
      <input type="text" id="new-note" placeholder="z.B. Bio-Samen, neue Charge…">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-new')">Abbrechen</button>
      <button class="btn-confirm" onclick="createChip()">Quellen starten 💧</button>
    </div>
  </div>
</div>

<!-- HARVEST MODAL -->
<div class="modal-backdrop" id="modal-harvest">
  <div class="modal">
    <h2>Ernte erfassen</h2>
    <p style="color:var(--text-dim);font-size:12px;margin-bottom:16px;">Glas <span id="harvest-glass-num">?</span> — alles optional</p>

    <div class="form-group">
      <label>Erntemengen (g)</label>
      <div class="stepper-row">
        <button class="stepper-btn" onclick="stepSeed('harvest-amount', -5)">−</button>
        <input class="stepper-input" type="number" id="harvest-amount" value="150" placeholder="150" min="0" step="5">
        <span class="stepper-unit">g</span>
        <button class="stepper-btn" onclick="stepSeed('harvest-amount', 5)">+</button>
      </div>
    </div>

    <div class="form-group">
      <label>Kommentar (optional)</label>
      <input type="text" id="harvest-comment" placeholder="z.B. schöne dichte Sprossen, leicht bitter…" style="width:100%;background:var(--surface2);border:1px solid var(--border-bright);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;outline:none;">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-harvest');finishHarvest(false)">Ohne Eingabe abschließen</button>
      <button class="btn-confirm" onclick="finishHarvest(true)">Abschließen ✓</button>
    </div>
  </div>
</div>

<!-- CONFIRM MOLD MODAL -->
<div class="modal-backdrop" id="modal-mold">
  <div class="modal">
    <h2>Glas verwerfen?</h2>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:16px;">Glas <span id="mold-glass-num">?</span> wirklich als verschimmelt markieren und in die History verschieben?</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-mold')">Abbrechen</button>
      <button class="action-btn danger" style="flex:2;padding:12px;font-size:13px;" onclick="confirmMold()">🦠 Verschimmelt — verwerfen</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
// ==================== STATE ====================
const STORAGE_KEY = 'sprossen_tracker_v2';
let state = { chips: [], history: [] };
let selectedGlass = null;
let pendingHarvestId = null;
let pendingMoldId = null;
let timerInterval = null;

// ==================== PERSISTENCE ====================
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function load() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { state = JSON.parse(raw); } catch(e) {}
  }
  // Ensure arrays
  if (!state.chips) state.chips = [];
  if (!state.history) state.history = [];
}

// ==================== UTILS ====================
function now() { return Date.now(); }

function fmtDateTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit'}) + ' ' +
         d.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
}

function fmtDuration(ms) {
  const total = Math.floor(ms / 1000);
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  if (d > 0) return `${d}T ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function getUsedGlasses() {
  return state.chips.map(c => c.glassNum);
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function showToast(msg, type='', duration=3500) {
  const tc = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  tc.appendChild(t);
  setTimeout(() => t.remove(), duration);
}

// ==================== MIDNIGHT RESET ====================
function checkMidnightReset() {
  const today = new Date().toDateString();
  state.chips.forEach(chip => {
    if (chip.phase === 'dunkel' || chip.phase === 'hell') {
      const lastReset = chip.lastReset || '';
      if (lastReset !== today) {
        // Check for missed watering before reset
        if (lastReset !== '') {
          const missedEntries = [];
          if (!chip.wateredMorning) missedEntries.push({ ts: now(), msg: `⚠ Morgens vergessen`, type: 'warn' });
          if (!chip.wateredEvening) missedEntries.push({ ts: now(), msg: `⚠ Abends vergessen`, type: 'warn' });
          if (missedEntries.length) {
            chip.log = chip.log || [];
            chip.log.push(...missedEntries);
            missedEntries.forEach(e => showToast(`Glas ${chip.glassNum}: ${e.msg}`, 'warn', 5000));
          }
        }
        chip.wateredMorning = false;
        chip.wateredEvening = false;
        chip.lastReset = today;
      }
    }
  });
  save();
}

// ==================== CHIP CREATION ====================
function openNewChip() {
  const used = getUsedGlasses();
  [1,2,3,4].forEach(n => {
    const btn = document.querySelector(`.glass-option[data-num="${n}"]`);
    if (used.includes(n)) {
      btn.disabled = true;
      btn.classList.remove('selected');
    } else {
      btn.disabled = false;
    }
  });
  selectedGlass = null;
  document.getElementById('seed1-amount').value = '5';
  document.getElementById('seed2-amount').value = '5';
  document.getElementById('new-note').value = '';
  document.querySelectorAll('.glass-option').forEach(b => b.classList.remove('selected'));
  document.getElementById('modal-new').classList.add('open');
}

function selectGlass(n) {
  if (getUsedGlasses().includes(n)) return;
  selectedGlass = n;
  document.querySelectorAll('.glass-option').forEach(b => b.classList.remove('selected'));
  document.querySelector(`.glass-option[data-num="${n}"]`).classList.add('selected');
}

function createChip() {
  if (!selectedGlass) { showToast('Bitte ein Glas auswählen', 'warn'); return; }
  const s1n = document.getElementById('seed1-name').value.trim();
  const s2n = document.getElementById('seed2-name').value.trim();
  const s1a = document.getElementById('seed1-amount').value.trim();
  const s2a = document.getElementById('seed2-amount').value.trim();

  if (!s1n && !s2n) { showToast('Bitte mindestens eine Samen-Art angeben', 'warn'); return; }

  const fmt = (name, amt) => {
    if (!name) return '';
    const num = parseFloat(amt);
    return (amt !== '' && !isNaN(num)) ? `${num}g ${name}` : name;
  };
  const seedsLabel = [fmt(s1n, s1a), fmt(s2n, s2a)].filter(Boolean).join(' + ');
  const note = document.getElementById('new-note').value.trim();

  const chip = {
    id: uid(),
    glassNum: selectedGlass,
    seeds: seedsLabel,
    note: note,
    phase: 'quellen',
    createdAt: now(),
    phaseStarted: now(),
    wateredMorning: false,
    wateredEvening: false,
    lastReset: new Date().toDateString(),
    log: [{ ts: now(), msg: `🌱 Glas ${selectedGlass} angelegt — ${seedsLabel}`, type: 'ok' }]
  };

  state.chips.push(chip);
  state.chips.sort((a,b) => a.glassNum - b.glassNum);
  save();
  closeModal('modal-new');
  renderAll();
  showToast(`Glas ${selectedGlass} — Quellen gestartet 💧`, 'ok');
}

// ==================== PHASE TRANSITIONS ====================
function endQuellen(id) {
  const chip = state.chips.find(c => c.id === id);
  if (!chip) return;
  const dur = fmtDuration(now() - chip.phaseStarted);
  chip.log.push({ ts: now(), msg: `💤 Quellen beendet nach ${dur}`, type: 'ok' });
  chip.phase = 'dunkel';
  chip.phaseStarted = now();
  chip.wateredMorning = false;
  chip.wateredEvening = false;
  chip.lastReset = new Date().toDateString();
  chip.log.push({ ts: now(), msg: `🌑 Dunkel-Keimen gestartet`, type: 'ok' });
  save();
  renderAll();
  showToast(`Glas ${chip.glassNum} — Dunkel-Keimen gestartet`, 'ok');
}

function endDunkel(id) {
  const chip = state.chips.find(c => c.id === id);
  if (!chip) return;
  const dur = fmtDuration(now() - chip.phaseStarted);
  chip.log.push({ ts: now(), msg: `🌑 Dunkel-Keimen beendet nach ${dur}`, type: 'ok' });
  chip.phase = 'hell';
  chip.phaseStarted = now();
  chip.wateredMorning = false;
  chip.wateredEvening = false;
  chip.lastReset = new Date().toDateString();
  chip.log.push({ ts: now(), msg: `☀️ Hell-Keimen gestartet`, type: 'ok' });
  save();
  renderAll();
  showToast(`Glas ${chip.glassNum} — Hell-Keimen gestartet ☀️`, 'ok');
}

function openHarvest(id) {
  const chip = state.chips.find(c => c.id === id);
  if (!chip) return;
  pendingHarvestId = id;
  document.getElementById('harvest-glass-num').textContent = chip.glassNum;
  document.getElementById('harvest-amount').value = '150';
  document.getElementById('harvest-comment').value = '';
  document.getElementById('modal-harvest').classList.add('open');
}

function finishHarvest(withData) {
  closeModal('modal-harvest');
  const id = pendingHarvestId;
  if (!id) return;
  const chip = state.chips.find(c => c.id === id);
  if (!chip) return;

  const dur = fmtDuration(now() - chip.phaseStarted);
  const amount = withData ? document.getElementById('harvest-amount').value.trim() : '';
  const comment = withData ? document.getElementById('harvest-comment').value.trim() : '';

  chip.log.push({ ts: now(), msg: `✅ Hell-Keimen beendet nach ${dur}`, type: 'ok' });
  if (amount) chip.log.push({ ts: now(), msg: `🌿 Ernte: ${amount}g`, type: 'ok' });
  if (comment) chip.log.push({ ts: now(), msg: `💬 ${comment}`, type: '' });
  chip.log.push({ ts: now(), msg: `🏁 Abgeschlossen`, type: 'ok' });

  const entry = {
    ...chip,
    status: 'completed',
    finishedAt: now(),
    harvestAmount: amount,
    harvestComment: comment
  };

  state.history.unshift(entry);
  state.chips = state.chips.filter(c => c.id !== id);
  save();
  renderAll();
  showToast(`Glas ${chip.glassNum} — Ernte abgeschlossen! 🌿`, 'ok');
  pendingHarvestId = null;
}

// ==================== STEPPER ====================
function stepSeed(id, delta) {
  const input = document.getElementById(id);
  const current = parseFloat(input.value) || 0;
  const next = Math.max(0, Math.round((current + delta) * 10) / 10);
  input.value = next;
}

// ==================== DELETE HISTORY ====================
function deleteHistory(id) {
  state.history = state.history.filter(e => e.id !== id);
  save();
  renderHistory();
  showToast('Eintrag gelöscht', '');
}

// ==================== WATERING ====================
function waterMorning(id) {
  const chip = state.chips.find(c => c.id === id);
  if (!chip || chip.wateredMorning) return;
  chip.wateredMorning = true;
  chip.log.push({ ts: now(), msg: `💧 Morgens gewässert`, type: 'ok' });
  save();
  renderAll();
}

function waterEvening(id) {
  const chip = state.chips.find(c => c.id === id);
  if (!chip || chip.wateredEvening) return;
  chip.wateredEvening = true;
  chip.log.push({ ts: now(), msg: `💧 Abends gewässert`, type: 'ok' });
  save();
  renderAll();
}

// ==================== MOLD ====================
function openMold(id) {
  const chip = state.chips.find(c => c.id === id);
  if (!chip) return;
  pendingMoldId = id;
  document.getElementById('mold-glass-num').textContent = chip.glassNum;
  document.getElementById('modal-mold').classList.add('open');
}

function confirmMold() {
  closeModal('modal-mold');
  const id = pendingMoldId;
  if (!id) return;
  const chip = state.chips.find(c => c.id === id);
  if (!chip) return;

  chip.log.push({ ts: now(), msg: `🦠 Als verschimmelt markiert`, type: 'danger' });

  const entry = { ...chip, status: 'aborted', finishedAt: now() };
  state.history.unshift(entry);
  state.chips = state.chips.filter(c => c.id !== id);
  save();
  renderAll();
  showToast(`Glas ${chip.glassNum} — verworfen`, 'error');
  pendingMoldId = null;
}

// ==================== MODAL ====================
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-backdrop').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) m.classList.remove('open');
  });
});

// ==================== RENDER ====================
function renderAll() {
  renderChips();
  renderHistory();
}

function renderChips() {
  const container = document.getElementById('chips-container');
  const empty = document.getElementById('empty-aktiv');

  if (state.chips.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Remember open logs
  const openLogs = new Set();
  container.querySelectorAll('.chip-log.open').forEach(el => openLogs.add(el.dataset.id));

  container.innerHTML = state.chips.map(chip => renderChip(chip, openLogs.has(chip.id))).join('');
}

function renderChip(chip, logOpen) {
  const phaseDur = fmtDuration(now() - chip.phaseStarted);
  const logHtml = (chip.log || []).slice().reverse().map(e =>
    `<div class="log-entry">
      <span class="log-time">${fmtDateTime(e.ts)}</span>
      <span class="log-msg ${e.type||''}">${e.msg}</span>
    </div>`
  ).join('');

  let phaseContent = '';
  let phaseBadge = '';

  if (chip.phase === 'quellen') {
    phaseBadge = `<span class="chip-phase-badge phase-badge-quellen">Quellen</span>`;
    phaseContent = `
      <div class="chip-timer">
        <span>💧</span>
        <span class="timer-value" data-phase-start="${chip.phaseStarted}" data-id="${chip.id}">Quellen seit ${phaseDur}</span>
      </div>
      <div class="chip-actions">
        <button class="action-btn primary" onclick="endQuellen('${chip.id}')">Quellen beenden → Dunkel-Keimen</button>
        <button class="action-btn danger" onclick="openMold('${chip.id}')">🦠</button>
      </div>`;

  } else if (chip.phase === 'dunkel') {
    phaseBadge = `<span class="chip-phase-badge phase-badge-dunkel">Dunkel</span>`;
    phaseContent = `
      <div class="chip-timer">
        <span>🌑</span>
        <span class="timer-value">Dunkel-Keimen ${phaseDur}</span>
      </div>
      <div class="watering-row">
        <button class="water-btn${chip.wateredMorning ? ' done' : ''}" onclick="waterMorning('${chip.id}')" ${chip.wateredMorning ? 'disabled' : ''}>☀️ Morgens wässern</button>
        <button class="water-btn${chip.wateredEvening ? ' done' : ''}" onclick="waterEvening('${chip.id}')" ${chip.wateredEvening ? 'disabled' : ''}>🌙 Abends wässern</button>
      </div>
      <div class="chip-actions">
        <button class="action-btn primary" onclick="endDunkel('${chip.id}')">→ Hell-Keimen ☀️</button>
        <button class="action-btn danger" onclick="openMold('${chip.id}')">🦠</button>
      </div>`;

  } else if (chip.phase === 'hell') {
    phaseBadge = `<span class="chip-phase-badge phase-badge-hell">Hell</span>`;
    phaseContent = `
      <div class="chip-timer">
        <span>☀️</span>
        <span class="timer-value">Hell-Keimen ${phaseDur}</span>
      </div>
      <div class="watering-row">
        <button class="water-btn${chip.wateredMorning ? ' done' : ''}" onclick="waterMorning('${chip.id}')" ${chip.wateredMorning ? 'disabled' : ''}>☀️ Morgens wässern</button>
        <button class="water-btn${chip.wateredEvening ? ' done' : ''}" onclick="waterEvening('${chip.id}')" ${chip.wateredEvening ? 'disabled' : ''}>🌙 Abends wässern</button>
      </div>
      <div class="chip-actions">
        <button class="action-btn primary" onclick="openHarvest('${chip.id}')">✅ Fertig — Ernte</button>
        <button class="action-btn danger" onclick="openMold('${chip.id}')">🦠</button>
      </div>`;
  }

  return `
    <div class="chip phase-${chip.phase}" data-id="${chip.id}">
      <div class="chip-header">
        <div class="glass-badge">${chip.glassNum}</div>
        <div class="chip-title-area">
          <div class="chip-seeds">${chip.seeds}</div>
          <div class="chip-meta">${fmtDateTime(chip.createdAt)}${chip.note ? ' · ' + chip.note : ''}</div>
        </div>
        ${phaseBadge}
      </div>
      ${phaseContent}
      <div class="chip-log-toggle" onclick="toggleLog('${chip.id}', this)">
        <span>${(chip.log||[]).length} Log-Einträge</span>
        <span class="log-arrow ${logOpen ? 'open' : ''}">▾</span>
      </div>
      <div class="chip-log ${logOpen ? 'open' : ''}" data-id="${chip.id}">
        ${logHtml || '<div style="color:var(--text-muted);font-size:11px">Keine Einträge</div>'}
      </div>
    </div>`;
}

function toggleLog(id, btn) {
  const log = btn.parentElement.querySelector('.chip-log');
  const arrow = btn.querySelector('.log-arrow');
  log.classList.toggle('open');
  arrow.classList.toggle('open');
}

function renderHistory() {
  const container = document.getElementById('history-container');
  const empty = document.getElementById('empty-history');

  if (state.history.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  container.innerHTML = state.history.map((entry, i) => {
    const statusClass = entry.status === 'completed' ? 'completed' : 'aborted';
    const badge = entry.status === 'completed'
      ? `<span class="history-badge badge-completed">✓ Geerntet</span>`
      : `<span class="history-badge badge-aborted">🦠 Verworfen</span>`;
    const totalDur = fmtDuration(entry.finishedAt - entry.createdAt);
    const harvest = entry.harvestAmount ? `· 🌿 ${entry.harvestAmount}g` : '';
    const comment = entry.harvestComment ? `<div style="font-size:11px;color:var(--text-dim);margin-top:4px;font-style:italic">💬 ${entry.harvestComment}</div>` : '';
    const logHtml = (entry.log||[]).slice().reverse().map(e =>
      `<div class="log-entry">
        <span class="log-time">${fmtDateTime(e.ts)}</span>
        <span class="log-msg ${e.type||''}">${e.msg}</span>
      </div>`).join('');

    return `
      <div class="history-chip ${statusClass}" data-history-id="${entry.id}">
        <div class="history-chip-header">
          <div class="glass-badge" style="background:var(--surface3)">${entry.glassNum}</div>
          <div style="flex:1">
            <div class="history-chip-title">${entry.seeds}</div>
          </div>
          ${badge}
        </div>
        <div class="history-details">
          <span>${fmtDateTime(entry.createdAt)}</span>
          <span>Dauer: ${totalDur}</span>
          ${harvest ? `<span>${harvest}</span>` : ''}
        </div>
        ${comment}
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:1px solid var(--border)">
          <div class="history-log-toggle" onclick="toggleHistoryLog(this)" style="margin-top:0;border:none;padding:0">▾ Log anzeigen</div>
          <button class="history-delete-btn" onclick="deleteHistory('${entry.id}')">🗑 löschen</button>
        </div>
        <div class="history-log">
          ${logHtml || '<div style="color:var(--text-muted);font-size:11px">Keine Einträge</div>'}
        </div>
      </div>`;
  }).join('');
}

function toggleHistoryLog(btn) {
  // btn is inside a flex wrapper div; find log within the parent chip
  const wrapper = btn.closest('.history-chip');
  const log = wrapper.querySelector('.history-log');
  log.classList.toggle('open');
  btn.textContent = log.classList.contains('open') ? '▴ Log ausblenden' : '▾ Log anzeigen';
}

// ==================== TABS ====================
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

// ==================== LIVE TIMER ====================
function startLiveTimers() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    state.chips.forEach(chip => {
      const el = document.querySelector(`.timer-value[data-id="${chip.id}"]`);
      if (el && chip.phase === 'quellen') {
        el.textContent = 'Quellen seit ' + fmtDuration(now() - chip.phaseStarted);
      }
    });
  }, 30000); // update every 30s (cheap)
}

// ==================== MIDNIGHT CHECK ====================
function scheduleMidnightCheck() {
  const midnight = new Date();
  midnight.setHours(24, 0, 5, 0);
  const msUntilMidnight = midnight - new Date();
  setTimeout(() => {
    checkMidnightReset();
    renderAll();
    scheduleMidnightCheck();
  }, msUntilMidnight);
}

// Also check on page load and every minute for background tab cases
setInterval(() => {
  checkMidnightReset();
}, 60000);

// ==================== INIT ====================
load();
checkMidnightReset();
renderAll();
startLiveTimers();
scheduleMidnightCheck();
</script>
</body>
</html>
